name: Backend CI

permissions:
  contents: write

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply compatible dependency security updates
        run: |
          npm audit fix
          npm audit --audit-level=high
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply compatible npm security updates [skip ci]"
            git push
          fi
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -path ./.git -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
