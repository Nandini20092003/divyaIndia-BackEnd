name: Backend CI

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -path ./.git -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
